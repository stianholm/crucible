x-vllm: &vllm
  image: nvcr.io/nvidia/vllm:26.08-py3
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  volumes:
    - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    - ./bench:/workspace/bench
  environment:
    HF_TOKEN: ${HF_TOKEN}
  restart: unless-stopped

services:
  # KV cache sizes are pinned in bytes (2026-10-16, TODO.md decision 70).
  # On this unified-memory platform vLLM sizes the KV cache from whatever is
  # resident when it starts, not from --gpu-memory-utilization alone: the same
  # 0.74 gave the proposer 0.06, 0.77 and 18.05 GiB on three starts in one
  # evening, depending on page cache and whether the judge was already up. The
  # pinned values reproduce exactly what both servers ran with for every
  # measurement since decision 22: proposer 6,188 blocks (589,824 bytes each),
  # judge 4,156 blocks (2,359,296 bytes each). Read from Prometheus's
  # vllm:cache_config_info history.
  vllm-proposer:
    <<: *vllm
    ports: ["127.0.0.1:8000:8000"]
    # PHASE-5.md task 5.2: the nightly job loads a fresh adapter into the
    # running server rather than restarting it with --lora-modules. The merge
    # replaces the anchor's lists and maps, so they are restated in full.
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ./bench:/workspace/bench
      - ./adapters:/adapters:ro
    environment:
      HF_TOKEN: ${HF_TOKEN}
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "1"
    command: >
      vllm serve openai/gpt-oss-120b
      --served-model-name proposer --port 8000
      --max-num-seqs 256
      --gpu-memory-utilization 0.74
      --kv-cache-memory-bytes 3649830912
      --enable-prefix-caching
      --max-model-len 65536
      --enable-lora --max-loras 4 --max-lora-rank 32
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 3
      # weight load alone runs ~7 min on this platform; give it room before
      # the first health check counts against it.
      start_period: 900s

  # Unified memory means the two engines' startup-time memory profiling is not
  # isolated (see CAPACITY.yaml notes) — starting both cold at once starves
  # whichever profiles second. Judge waits for proposer to report healthy
  # before it starts its own engine.
  vllm-judge:
    <<: *vllm
    ports: ["127.0.0.1:8001:8001"]
    command: >
      vllm serve Qwen/Qwen3-4B
      --served-model-name judge --port 8001
      --max-num-seqs 64
      --gpu-memory-utilization 0.09
      --kv-cache-memory-bytes 9805234176
      --max-model-len 16384
    depends_on:
      vllm-proposer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Qwen3-4B is far smaller than the proposer's gpt-oss-120b; 300s is
      # generous, not measured against a real cold load. Added alongside
      # vllm-embed, 2026-09-26 - judge had no healthcheck of its own before
      # this, only proposer did, since nothing previously needed to
      # sequence a start *after* judge specifically.
      start_period: 300s

  # No embedding server here, persistent or on-demand — tried both
  # (Qwen3-Embedding-0.6B, 2026-09-26/27) and abandoned the approach
  # entirely, not just the persistent form. A small gpu-memory-utilization
  # (0.02-0.03) persistent server either left this box's free memory right
  # at the edge or crash-looped outright; a completely fresh, isolated
  # `docker run --rm` container (no persistent service at all) hit the
  # identical `torch.AcceleratorError: CUDA error: out of memory` at basic
  # device init, before vLLM even got to KV cache sizing. Proposer (0.74)
  # + judge (0.09) already reserve 83% of the unified pool for their
  # lifetime — a third CUDA process can't even start alongside them,
  # ephemeral or not. See docs/platform.md's "A third CUDA process doesn't fit
  # either" section for the full account. Phase 4's failure taxonomy (task
  # 4.1) uses TF-IDF instead, at zero GPU cost — see harness/taxonomy.py.

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
    depends_on:
      - vllm-proposer
      - vllm-judge

  # --- Observability: Postgres, Redis, MinIO and ClickHouse are shared between
  # Langfuse (here) and the harness itself (Phase 3). One copy of each, per
  # PHASE-0.md task 0.4 — running two is an avoidable few GB on a fixed pool.

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - crucible_postgres_data:/var/lib/postgresql/data

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_AUTH}
      --maxmemory-policy noeviction
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - crucible_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    # 'candidates' bucket: Phase 3's archive stores candidate text here
    # (harness/storage.py), retrievable by sha — the iteration table only
    # ever carried a one-way hash, not the text itself.
    command: -c 'mkdir -p /data/langfuse /data/candidates && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9091:9001"
      - "127.0.0.1:9002:9000"   # S3 API, needed by harness/storage.py running on the host — 9000 is ClickHouse's native-protocol port
    volumes:
      - crucible_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - crucible_clickhouse_data:/var/lib/clickhouse
      - crucible_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports: ["127.0.0.1:3030:3030"]
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:3
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports: ["127.0.0.1:3000:3000"]
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  prometheus:
    image: docker.io/prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - crucible_prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: docker.io/grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - crucible_grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on:
      - prometheus

volumes:
  crucible_postgres_data:
  crucible_redis_data:
  crucible_minio_data:
  crucible_clickhouse_data:
  crucible_clickhouse_logs:
  crucible_prometheus_data:
  crucible_grafana_data:
