model_list:
  - model_name: proposer
    litellm_params:
      model: hosted_vllm/proposer
      api_base: http://vllm-proposer:8000/v1
  # PHASE-5.md task 5.4: the distilled proposer, a LoRA adapter on the same
  # server. ops/nightly.sh loads each night's adapter under the stable vLLM
  # name "distilled", so this entry never changes; which adapter is behind it
  # is the `root` field of vLLM's /v1/models. Requests fail with 404 while no
  # adapter is loaded.
  - model_name: proposer-distilled
    litellm_params:
      model: hosted_vllm/distilled
      api_base: http://vllm-proposer:8000/v1
  - model_name: judge
    litellm_params:
      model: hosted_vllm/judge
      api_base: http://vllm-judge:8001/v1

router_settings:
  num_retries: 3
  # at high concurrency one sequence can decode at ~4 tok/s.
  # a 5-minute timeout kills healthy requests. this is the documented trap.
  timeout: 1200

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

general_settings:
  max_parallel_requests: 256
