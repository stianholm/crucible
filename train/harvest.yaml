# PHASE-5.md task 5.1: which runs the training set is harvested from.
#
# Eligibility is a fitness question. A claim is only a training signal under
# the fitness it was earned against, and capability_case's fitness changed
# repeatedly before settling (TODO.md decisions 40, 53, 57, 66). Only runs
# under the fitness in force now are listed: corrected worker, class-balanced
# quality, k=9, output contract appended after the evolved instructions, judge
# failures as missing data. That is decision 67's ablation and nothing earlier.
#
# `reports` is where claims come from for runs made before 2026-10-16, when
# iteration.accepted started recording them (harness/generation.py). Leave it
# out for later runs and the harvest reads the column instead.
#
# Arm B runs are included. Their proposer contexts carry the lesson block,
# which is what the proposer actually saw, and training on the real context is
# the point of the exercise.

