[project]
name = "crucible"
version = "0.1.0"
description = "Evolutionary harness for continuously improving an onboarded solution"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0",
    "pytest>=8.0",
    "rich>=13.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "boto3>=1.34",
    "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["harness"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
